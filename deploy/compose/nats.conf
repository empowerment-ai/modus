# NATS for the planned event-ingest role (docker compose --profile nats up).
# JetStream keeps the streams; the MQTT listener lets cameras and sensors
# publish without a NATS client. Modus does not connect to it yet.

server_name: modus-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data
}

mqtt {
  listen: 0.0.0.0:1883
}
