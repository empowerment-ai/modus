{{- include "modus.validate" . -}}
# Settings shared by every Modus pod. Secrets are referenced from existing Secrets in deployment.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "modus.fullname" . }}
  labels:
    {{- include "modus.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  PORT: "8787"
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  TIME_SCALE: {{ .Values.config.timeScale | quote }}
  STATIC_DIR: {{ ternary "/app/public" "" .Values.config.serveStudio | quote }}
  DATA_DIR: "/data"
  DB_DIALECT: {{ .Values.database.dialect | quote }}
  {{- if ne .Values.database.dialect "memory" }}
  DB_POOL_MAX: {{ .Values.database.poolMax | quote }}
  {{- end }}
  TENANT_MODE: {{ .Values.tenancy.mode | quote }}
  MODUS_ASSISTANT_MODEL: {{ .Values.assistant.model | quote }}
  MODUS_ASSISTANT_EFFORT: {{ .Values.assistant.effort | quote }}
  MODUS_ASSISTANT_FALLBACKS: {{ .Values.assistant.fallbacks | quote }}
  {{- if or .Values.webhooks.endpoints .Values.webhooks.existingSecret }}
  WEBHOOKS_ALLOW_HTTP: {{ .Values.webhooks.allowHttp | toString | quote }}
  WEBHOOKS_KEEP_DAYS: {{ .Values.webhooks.keepDays | quote }}
  WEBHOOKS_KEEP_FAILED_DAYS: {{ .Values.webhooks.keepFailedDays | quote }}
  {{- end }}
  {{- if .Values.webhooks.endpoints }}
  # The file is the -webhooks ConfigMap, mounted by deployment.yaml.
  WEBHOOKS_FILE: "/etc/modus/webhooks.json"
  {{- end }}
