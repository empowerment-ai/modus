apiVersion: v1
kind: Service
metadata:
  name: {{ include "modus.fullname" . }}
  labels:
    {{- include "modus.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  # Every pod that plays the api role.
  selector:
    {{- include "modus.selectorLabels" . | nindent 4 }}
    modus.io/serves-http: "true"
