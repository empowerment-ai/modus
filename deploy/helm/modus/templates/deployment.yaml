{{- $memory := eq .Values.database.dialect "memory" -}}
{{- range $name, $d := .Values.deployments }}
{{- if $d.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "modus.fullname" $ }}-{{ $name }}
  labels:
    {{- include "modus.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  {{- if not (and $.Values.autoscaling.enabled (eq $.Values.autoscaling.deployment $name)) }}
  replicas: {{ $d.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    # In-memory state and a ReadWriteOnce volume: the old pod must stop before the new one starts.
    type: {{ ternary "Recreate" "RollingUpdate" $memory }}
  selector:
    matchLabels:
      {{- include "modus.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        {{- include "modus.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $name }}
        {{- if has "api" $d.roles }}
        modus.io/serves-http: "true"
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
        {{- with $d.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "modus.serviceAccountName" $ }}
      automountServiceAccountToken: {{ $.Values.serviceAccount.automount }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      containers:
        - name: modus
          image: {{ include "modus.image" $ | quote }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8787
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "modus.fullname" $ }}
          env:
            - name: MODUS_ROLES
              value: {{ join "," $d.roles | quote }}
            {{- if $.Values.assistant.existingSecret }}
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.assistant.existingSecret }}
                  key: {{ $.Values.assistant.apiKeyKey }}
            {{- end }}
            {{- if and (not $memory) $.Values.database.existingSecret }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.database.existingSecret }}
                  key: {{ $.Values.database.urlKey }}
            {{- end }}
            {{- with $.Values.config.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            {{- toYaml $.Values.probes.startup | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            {{- toYaml $.Values.probes.liveness | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/ready
              port: http
            {{- toYaml $.Values.probes.readiness | nindent 12 }}
          {{- with $d.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if and $memory $.Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $.Values.persistence.existingClaim | default (printf "%s-data" (include "modus.fullname" $)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with $d.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $d.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
