# Load test stack: a disposable Postgres, 1-3 Modus servers built from the working
# tree, and nginx in front. Driven by `pnpm load` (src/run.ts); by hand:
#
#   docker compose -f tools/load/compose.yml -p modus-load [--profile s2] [--profile s3] up -d --build
#   docker compose -f tools/load/compose.yml -p modus-load down -v
#
# Its own project name and 127.0.0.1 ports, so it never touches the dev stack.
# Every secret here is a throwaway for this stack only.

name: modus-load

x-modus: &modus
  build: ../..
  image: modus-load:local
  environment:
    TIME_SCALE: ${TIME_SCALE:-60}
    LOG_LEVEL: ${LOG_LEVEL:-info}
    DB_DIALECT: postgres
    DATABASE_URL: postgres://modus:modus-load@postgres:5432/modus
    # 3 servers x 20 stays well under max_connections, with room for setup and psql.
    DB_POOL_MAX: 20
    STATIC_DIR: /app/public
    # The image's DATA_DIR only draws a warning with Postgres.
    DATA_DIR: ''
    # No key: the built-in assistant, never a paid model, under load.
    ANTHROPIC_API_KEY: ''
    # The observer (Task 3) measures delivery lag; until it runs, deliveries retry.
    WEBHOOK_URL: http://observer:8791/hook
    WEBHOOK_SECRET: modus-load-webhook-secret
    WEBHOOKS_ALLOW_HTTP: 'true'
  depends_on:
    postgres:
      condition: service_healthy
  # Ready means the database answers, so `up --wait` and nginx start on a working server.
  healthcheck:
    test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8787/api/ready || exit 1']
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s
  # Laptop-sized, and the same for every server so 1/2/3-server runs compare.
  deploy:
    resources:
      limits:
        cpus: '1.5'
        memory: 1g

services:
  postgres:
    image: postgres:18-alpine
    command: ['postgres', '-c', 'max_connections=300']
    environment:
      POSTGRES_DB: modus
      POSTGRES_USER: modus
      POSTGRES_PASSWORD: modus-load
    ports:
      # setup.ts writes the test design from the host before the servers start.
      - '127.0.0.1:5546:5432'
    # Disposable: every run starts from an empty database, and tmpfs keeps disk I/O out of the numbers.
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      # Over TCP: the first-run initialization server listens only on the socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U modus -d modus']
      interval: 2s
      timeout: 3s
      retries: 30

  modus1:
    <<: *modus

  modus2:
    <<: *modus
    profiles: [s2, s3]

  modus3:
    <<: *modus
    profiles: [s3]

  nginx:
    image: nginx:1.30.1-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '127.0.0.1:8790:80'
    depends_on:
      modus1:
        condition: service_healthy
