# Round robin over whichever of modus1..3 exist. `resolve` looks the names up at
# run time through Docker's DNS, so servers left out by the s2/s3 profiles are
# simply absent instead of failing startup (open-source nginx 1.27.3+).
# max_fails=0: a slow answer must not take a server out of the rotation. With two servers and
# the default (one failure out for 10 s), a few 60 s timeouts left no server and nginx answered
# 502 itself; the run should measure the servers, not nginx's health guesses.
# This is for the harness only, not a setting for a production proxy.
upstream modus {
  zone modus 64k;
  resolver 127.0.0.11 valid=30s ipv6=off;
  server modus1:8787 resolve max_fails=0;
  server modus2:8787 resolve max_fails=0;
  server modus3:8787 resolve max_fails=0;
  keepalive 64;
}

server {
  listen 80;
  client_max_body_size 10m;

  proxy_http_version 1.1;
  # Upstream keepalive needs an empty Connection header.
  proxy_set_header Connection '';
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  # Live screens: events must reach the client as they happen, and streams stay open for the whole run.
  location ~ ^/api/apps/[^/]+/stream$ {
    proxy_pass http://modus;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location / {
    proxy_pass http://modus;
    # Past k6's own 60 s request timeout, so a slow answer is k6's timeout on any number of servers.
    proxy_read_timeout 90s;
  }
}
