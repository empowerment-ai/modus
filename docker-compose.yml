# Modus with Docker Compose.
#
#   docker compose up --build                  # Modus on http://localhost:8787, stored in Postgres
#   docker compose --profile nats up           # also start the optional services you name
#   DB_DIALECT=memory docker compose up --no-deps modus   # no database: JSON snapshots in the modus-data volume
#
# `modus` and `postgres` start by default: Modus keeps the design, live state
# and event log in PostgreSQL (the postgres-data volume) and runs its schema
# migrations at startup. The nats and keycloak profiles are infrastructure the
# roadmap adds (docs/DEPLOYMENT.md); Modus does not use them yet.
#
# Secrets come from your shell or an untracked .env file next to this one,
# never from this file: ANTHROPIC_API_KEY=... docker compose up
# POSTGRES_PASSWORD has a development-only default; set your own in .env (URL-safe
# characters only: it is also spliced into DATABASE_URL below). It takes effect
# when the postgres-data volume is first created.

name: modus

services:
  modus:
    build: .
    image: modus:local
    ports:
      - '${MODUS_PORT:-8787}:8787'
    environment:
      TIME_SCALE: ${TIME_SCALE:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional: turns on the language-model assistant (built-in assistant otherwise).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MODUS_ASSISTANT_MODEL: ${MODUS_ASSISTANT_MODEL:-claude-opus-5-5}
      # `memory` ignores DATABASE_URL and snapshots to /data instead.
      DB_DIALECT: ${DB_DIALECT:-postgres}
      DATABASE_URL: postgres://modus:${POSTGRES_PASSWORD:-modus-dev-only}@postgres:5432/modus
    volumes:
      - modus-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL 18: Modus's storage (milestone M2, first slice).
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: modus
      POSTGRES_USER: modus
      # Development only; set your own in .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-modus-dev-only}
    ports:
      # For psql and `pnpm test:pg` from the host; POSTGRES_PORT moves it off a local server's 5432.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: the image's first-run initialization server listens only on the socket.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U modus -d modus']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ----- Optional, planned: not used by Modus yet -----

  # NATS JetStream with its MQTT listener: event ingest for high-volume signals (milestone M5).
  nats:
    profiles: [nats]
    image: nats:2.14-alpine
    command: ['-c', '/etc/nats/nats.conf']
    ports:
      - '127.0.0.1:4222:4222' # NATS clients
      - '127.0.0.1:1883:1883' # MQTT devices
      - '127.0.0.1:8222:8222' # monitoring
    volumes:
      - ./deploy/compose/nats.conf:/etc/nats/nats.conf:ro
      - nats-data:/data

  # Keycloak as the OIDC provider that will replace the x-user-id header (milestone M2).
  keycloak:
    profiles: [keycloak]
    image: quay.io/keycloak/keycloak:26.6
    command: ['start-dev']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      # Development only; set your own in .env.
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-modus-dev-only}
    ports:
      - '127.0.0.1:8180:8080'

volumes:
  modus-data:
  postgres-data:
  nats-data:
