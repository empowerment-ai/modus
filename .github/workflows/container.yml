name: Container image

# Pull requests build the image (amd64, not pushed) and smoke-test it.
# Pushes to main publish ghcr.io/empowerment-ai/modus:main and :sha-<short>;
# version tags (v1.2.3) also publish :1.2.3 and :1.2. Images are multi-arch
# (amd64 + arm64) with an SBOM and provenance attestation.

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/empowerment-ai/modus

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=Modus
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.vendor=Empowerment AI

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'pull_request' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}

      - name: Smoke test the image
        if: github.event_name == 'pull_request'
        env:
          REF: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
        run: |
          docker run -d --name modus -p 8787:8787 "$REF"
          for _ in $(seq 1 30); do curl -fsS localhost:8787/api/ready && break; sleep 1; done
          curl -fsS localhost:8787/api/health
          curl -fsS localhost:8787/ | grep -q 'id="root"'
          test "$(curl -fsS localhost:8787/api/apps | jq length)" -gt 0
          docker rm -f modus
